apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marimocad-notebooks
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marimocad
spec:
  replicas: 1
  selector:
    matchLabels:
      app: marimocad
  template:
    metadata:
      labels:
        app: marimocad
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: marimocad
          image: ghcr.io/roaldo/marimocad:latest
          ports:
            - containerPort: 8080
          command:
            - marimo
            - edit
            - --host
            - "0.0.0.0"
            - --port
            - "8080"
            - --no-token
          workingDir: /home/user/notebooks
          volumeMounts:
            - name: notebooks
              mountPath: /home/user/notebooks
      volumes:
        - name: notebooks
          persistentVolumeClaim:
            claimName: marimocad-notebooks
---
apiVersion: v1
kind: Service
metadata:
  name: marimocad
spec:
  type: NodePort
  selector:
    app: marimocad
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30881
